name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            homescreen/client/package-lock.json
            homescreen/server/package-lock.json

      - name: Install client dependencies
        working-directory: homescreen/client
        run: npm ci

      - name: Lint client
        working-directory: homescreen/client
        run: npm run lint

      - name: Build client
        working-directory: homescreen/client
        run: npm run build

      - name: Install server dependencies
        working-directory: homescreen/server
        run: npm ci

      - name: Build server
        working-directory: homescreen/server
        run: npm run build
